apiVersion: eshu.dev/v1alpha1
kind: ComponentPackage
metadata:
  id: collector-gcp-cloud
  name: GCP Cloud collector
  publisher: eshu-hq
  version: 0.1.4
spec:
  # Floor demonstrated by the ops-qa cutover (eshu-hq/eshu#8856): the same
  # range the sibling aws-cloud satellite declares, and the chart's
  # install gate requires it (spec.compatibleCore is required on a dev
  # core). The satellite speaks collector-sdk/v1alpha1 against that core.
  compatibleCore: ">=0.0.5 <0.2.0"
  componentType: collector
  collectorKinds:
    - gcp
  runtime:
    # Single-shot SDK output: the satellite speaks collector-sdk/v1alpha1
    # (the pinned SDK pair has no v1alpha3 page envelope), so every host
    # request gets exactly one result document back.
    sdkProtocol: collector-sdk/v1alpha1
    adapter: process
  artifacts:
    - platform: linux/amd64
      # Exact pin for the 0.1.4 release: the tagged image built from v0.1.4
      # (source-URI stamp for eshu-hq/eshu#8856). The seed installer stamps
      # the deployed reference at install time.
      image: ghcr.io/eshu-hq/eshu-collector-gcp-cloud@sha256:06cc0b5747226adea1d753df61b097930bb8220e17c838346e6a1b2bec840a38
  emittedFacts:
    - kind: gcp_cloud_resource
      payloadSchemaRef: gcp_cloud_resource
      schemaVersions:
        - 1.1.0
      sourceConfidence:
        - reported
    - kind: gcp_cloud_relationship
      payloadSchemaRef: gcp_cloud_relationship
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    - kind: gcp_tag_observation
      payloadSchemaRef: gcp_tag_observation
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    - kind: gcp_iam_policy_observation
      payloadSchemaRef: gcp_iam_policy_observation
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    - kind: gcp_dns_record
      payloadSchemaRef: gcp_dns_record
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    - kind: gcp_image_reference
      payloadSchemaRef: gcp_image_reference
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    - kind: gcp_iam_principal
      payloadSchemaRef: gcp_iam_principal
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    - kind: gcp_iam_trust_policy
      payloadSchemaRef: gcp_iam_trust_policy
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    - kind: gcp_iam_permission_policy
      payloadSchemaRef: gcp_iam_permission_policy
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
    - kind: gcp_collection_warning
      payloadSchemaRef: gcp_collection_warning
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - reported
  telemetry:
    metricsPrefix: eshu_dp_gcp_cloud_
