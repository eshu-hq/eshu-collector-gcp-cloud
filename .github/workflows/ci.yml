name: ci

# Org gate contract for eshu-hq collector repos (eshu-hq/eshu#8856 cutover
# pre-work): stable job names lint/test/race/shell/image, a changes
# path-filter job, and a ci-complete aggregator. ci-complete is the only
# context the main ruleset requires. No static gates: lanes judge the code
# itself, except the 500-line .go file cap (plain wc -l step in lint).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly Monday 04:23 UTC sweep: govulncheck + gosec. Lane jobs also run
    # as a post-merge record; only the two scan jobs can file issues.
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COVERAGE_FLOOR: 90
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.9.0
  GOSEC_VERSION: v2.30.0
  SHELLCHECK_VERSION: v0.10.0
  ACTIONLINT_VERSION: 1.7.9

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      workflow: ${{ steps.filter.outputs.workflow }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            fixtures:
              # Every entry is test-consumed (grep-proven): extractor
              # *_fixture_test.go files os.ReadFile testdata/*.json,
              # gcpruntime doc_pin_test.go reads ../gcpcloud/testdata, and
              # proof_*_test.go read gcpruntime/testdata. No go:embed,
              # *.yaml, or manifest file exists in this repo.
              - '**/testdata/**'
              - '**/*.json'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            workflow:
              - '.github/workflows/**'
            image:
              - 'Dockerfile'
              - 'cmd/**'

  lint:
    name: lint
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - name: golangci-lint run
        run: golangci-lint run ./...
      - name: gofumpt format check
        run: |
          golangci-lint fmt --diff ./... > /tmp/fmt.diff || true
          if [ -s /tmp/fmt.diff ]; then
            cat /tmp/fmt.diff
            echo 'unformatted files: run golangci-lint fmt -w ./...'
            exit 1
          fi
      - name: go mod tidy check
        run: go mod tidy -diff
      - name: 500-line file cap
        run: |
          fail=0
          for f in $(git ls-files '*.go'); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "::error file=$f::over the 500-line cap ($lines lines): split the file"
              fail=1
            fi
          done
          exit $fail
      - name: actionlint
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.workflow == 'true' }}
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${{ env.ACTIONLINT_VERSION }}/actionlint_${{ env.ACTIONLINT_VERSION }}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml

  test:
    name: test
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./... -count=1

  race:
    name: race
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: go test -race with coverage
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
      - name: Coverage summary and floor
        env:
          COVERAGE_FLOOR: ${{ env.COVERAGE_FLOOR }}
        run: |
          python3 - <<'EOF'
          import collections
          import os
          import sys
          floor = float(os.environ['COVERAGE_FLOOR'])
          stats = collections.OrderedDict()
          total = [0, 0]
          with open('coverage.out') as fh:
              for line in fh:
                  parts = line.split()
                  if len(parts) != 3:
                      continue
                  loc, num, cnt = parts
                  try:
                      path, _blk = loc.rsplit(':', 1)
                      stmts = int(num)
                      hits = int(cnt)
                  except (IndexError, ValueError):
                      continue
                  pkg = path.rsplit('/', 1)[0]
                  row = stats.setdefault(pkg, [0, 0])
                  row[0] += stmts
                  total[0] += stmts
                  if hits > 0:
                      row[1] += stmts
                      total[1] += stmts
          out = ['| Package | Statements | Covered |', '|---|---|---|']
          for pkg, (t, c) in stats.items():
              pct = 100.0 * c / t if t else 100.0
              out.append(f'| `{pkg}` | {t} | {pct:.1f}% |')
          tpct = 100.0 * total[1] / total[0]
          out.append(f'| **TOTAL** | **{total[0]}** | **{tpct:.1f}%** |')
          summary = '## Coverage\n\n' + '\n'.join(out) + '\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write(summary)
          print(summary)
          if tpct < floor:
              print(f'total {tpct:.1f}% is below COVERAGE_FLOOR={floor:g}')
              sys.exit(1)
          EOF

  shell:
    name: shell
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck
        run: |
          curl -sSfL -o /tmp/shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${{ env.SHELLCHECK_VERSION }}/shellcheck-v${{ env.SHELLCHECK_VERSION }}.linux.x86_64.tar.xz"
          tar -xf /tmp/shellcheck.tar.xz -C /tmp
          echo "/tmp/shellcheck-v${{ env.SHELLCHECK_VERSION }}" >> "$GITHUB_PATH"
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo 'no shell scripts tracked: lane vacuously green'
            exit 0
          fi
          shellcheck "${scripts[@]}"

  image:
    name: image
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Vacuous image proof
        run: |
          # No Dockerfile and no cmd/ exist in this repo, so there is no
          # image to build. If either appears, this lane fails until a real
          # image build lane replaces this proof.
          test ! -e Dockerfile || { echo 'Dockerfile exists: add a real image build lane'; exit 1; }
          test ! -d cmd || { echo 'cmd/ exists: add a real image build lane'; exit 1; }
          echo 'no Dockerfile or cmd/: no image to build (vacuous green)'

  govulncheck:
    name: govulncheck
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: govulncheck
        run: govulncheck -scan package ./...
      - name: File tracking issue on scheduled findings
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title='govulncheck findings on the weekly sweep'
          num=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number // empty')
          body="Weekly govulncheck sweep failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue comment "$num" --body "$body"
          fi

  gosec:
    name: gosec
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
      - name: gosec SARIF
        # Advisory until the false-positive rate here is measured: findings
        # are triaged in the open, never blanket-excluded. Gate on the SARIF
        # result count, not gosec's exit code.
        run: |
          gosec -no-fail -fmt=sarif -out gosec.sarif ./...
          test -f gosec.sarif
          count=$(python3 -c "import json; print(sum(len(r.get('results', [])) for r in json.load(open('gosec.sarif'))['runs']))")
          echo "gosec findings: $count" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SARIF
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: gosec.sarif

  ci-complete:
    name: ci-complete
    needs: [changes, lint, test, race, shell, image, govulncheck, gosec]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Aggregate lane results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys
          needs = json.loads(os.environ['NEEDS'])
          for name in sorted(needs):
              print(f"{name}: {needs[name].get('result')}")
          bad = {k: v.get('result') for k, v in needs.items()
                 if v.get('result') not in ('success', 'skipped')}
          if bad:
              print(f'ci-complete: failing lanes: {bad}')
              sys.exit(1)
          print('ci-complete: every lane succeeded or was legitimately skipped')
          EOF
