name: ci

# Thin caller over the org reusable Go collector CI
# (eshu-hq/.github go-collector-ci.yml v2, pinned by peeled commit SHA with a
# version comment, never the mutable tag). Lane bodies live in the reusable;
# this file keeps only the paths-filter `changes` job, the single `go-ci`
# call with run-* flags wired to the filter, a local `ci-complete`
# aggregator, and a schedule-only `notify` that preserves the weekly
# govulncheck/gosec issue-filing behavior.
#
# Stable job names: the reusable's inner lanes are lint, test, race, shell,
# image, boundary, govulncheck, gosec, actionlint, ci-complete — identical to
# the in-repo lanes they replace. `ci-complete` (the local aggregator below)
# is the only context the main ruleset requires; the reusable's inner
# `go-ci / ci-complete` is informational. No static gates: lanes judge the
# code itself, except the 500-line .go file cap (plain wc -l in the reusable
# lint lane). This repo ships no Dockerfile or cmd/, so run-image stays
# false and the boundary hook proves that vacuity (it fails the day either
# appears, until a real image lane replaces it).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly Monday 04:23 UTC sweep: govulncheck + gosec. Lane jobs also run
    # as a post-merge record; only the notify job can file issues.
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      workflow: ${{ steps.filter.outputs.workflow }}
      image: ${{ steps.filter.outputs.image }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # Needed so the `misc` catch-all below can use `!` negations;
          # groups without negations behave exactly as before.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            fixtures:
              # Every entry is test-consumed (grep-proven): extractor
              # *_fixture_test.go files os.ReadFile testdata/*.json,
              # gcpruntime doc_pin_test.go reads ../gcpcloud/testdata, and
              # proof_*_test.go read gcpruntime/testdata. No go:embed,
              # *.yaml, or manifest file exists in this repo.
              - '**/testdata/**'
              - '**/*.json'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            workflow:
              - '.github/workflows/**'
            image:
              - 'Dockerfile'
              - 'cmd/**'
            misc:
              # Fail-closed catch-all: anything not classified above runs
              # the full Go lanes (lint+test+race). Docs stay skipped so a
              # docs-only PR keeps passing vacuously (probe #3); every
              # classified pattern is negated too so narrow lanes keep
              # their shape. This classifies Makefile,
              # .github/dependabot.yml, and all future file types.
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!CODEOWNERS'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!**/testdata/**'
              - '!**/*.json'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!cmd/**'
              - '!.github/workflows/**'

  go-ci:
    name: go-ci
    needs: [changes]
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: gcp-cloud
      working-directory: .
      go-version-file: go.mod
      coverage-floor: 90
      # No Dockerfile or cmd/ in this repo: the image lane stays off and the
      # boundary hook below proves that vacuity instead.
      run-image: false
      run-lint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflow == 'true' }}
      run-test: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflow == 'true' }}
      run-race: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflow == 'true' }}
      run-shell: ${{ github.event_name != 'pull_request' || needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflow == 'true' }}
      run-boundary: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflow == 'true' }}
      boundary-command: >-
        test ! -e Dockerfile && test ! -d cmd ||
        { echo 'Dockerfile or cmd/ appeared: replace this vacuity proof with a real image lane'; exit 1; }
      run-govulncheck: ${{ github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' }}
      run-gosec: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflow == 'true' }}
      # Scheduled runs opt into failure so the notify job below can file the
      # tracking issue; PR lanes stay advisory.
      gosec-fail-on-findings: ${{ github.event_name == 'schedule' }}
      run-actionlint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.workflow == 'true' }}
      # Tool pins match the pre-swap in-repo lane pins; the rest ride the
      # reusable v2 defaults (golangci-lint v2.12.2, govulncheck v1.9.0,
      # actionlint 1.7.12 sha256-checked).
      gosec-version: v2.30.0

  ci-complete:
    name: ci-complete
    needs: [changes, go-ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Aggregate lane results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys
          needs = json.loads(os.environ['NEEDS'])
          for name in sorted(needs):
              print(f"{name}: {needs[name].get('result')}")
          bad = {k: v.get('result') for k, v in needs.items()
                 if v.get('result') not in ('success', 'skipped')}
          if bad:
              print(f'ci-complete: failing lanes: {bad}')
              sys.exit(1)
          print('ci-complete: every lane succeeded or was legitimately skipped')
          EOF

  notify:
    name: notify
    needs: [go-ci]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: File tracking issue on scheduled findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title='weekly sweep findings (govulncheck/gosec)'
          num=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number // empty')
          body="Weekly sweep failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue comment "$num" --body "$body"
          fi
